# Re-records the Work section's demo clips from the live sites. Run it by hand from the
# Actions tab ("Refresh demo clips", Run workflow) after a site changes a lot. Each site
# records in its own job; the clips are committed to master, which redeploys the site.
name: Refresh demo clips
on:
  workflow_dispatch:
    inputs:
      site:
        description: "One site to re-record (its id, like hookline), or all"
        default: all
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # every site, or just the one named when the workflow was started
        site: ${{ fromJSON((inputs.site == '' || inputs.site == 'all') && '["hookline","unearth","specimen","fieldsense","oikos","wakerush","splash","plato","dipper","careeva","cryptosites","wayfound","staywestpalm"]' || format('["{0}"]', inputs.site)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Browser and tools
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2 sharp
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
          cp $GITHUB_WORKSPACE/scripts/capture/demos.mjs /tmp/pw/
      - name: Record
        run: |
          cd /tmp/pw
          DEMOS="$(cat $GITHUB_WORKSPACE/scripts/capture/demos.json)" OUT=$GITHUB_WORKSPACE/public/demos timeout 900 node demos.mjs ${{ matrix.site }}
          # the WebM copy, for browsers built without H.264
          cd $GITHUB_WORKSPACE/public/demos
          for f in ${{ matrix.site }}-*.mp4; do ffmpeg -y -loglevel error -i "$f" -c:v libvpx-vp9 -b:v 0 -crf 40 -row-mt 1 -an "${f%.mp4}.webm"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/demos
          git commit -m "Refresh the ${{ matrix.site }} demo clips" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && exit 0; sleep $((RANDOM % 9 + 3)); done
          exit 1
